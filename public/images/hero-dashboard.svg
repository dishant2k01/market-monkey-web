<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Market Monkey dashboard preview</title>
  <desc id="desc">Product interface with market overview chart, trending markets, and top industries.</desc>
  <defs>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ECB3D" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4ECB3D" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="720" fill="#F9FAFB"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="196" height="720" fill="#111827"/>
  <circle cx="36" cy="40" r="14" fill="#4ECB3D"/>
  <rect x="58" y="30" width="96" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="58" y="46" width="64" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.35"/>

  <rect x="24" y="96" width="148" height="36" rx="8" fill="#4ECB3D"/>
