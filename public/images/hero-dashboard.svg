  <path d="M244 320 C290 300 320 250 360 260 C400 270 430 220 470 210 C510 200 540 240 580 230 C600 226 620 210 640 200 L640 340 L244 340 Z" fill="url(#chartFill)"/>

  <!-- Trending Markets -->
  <rect x="660" y="100" width="260" height="280" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="684" y="124" width="130" height="12" rx="6" fill="#111827"/>
  <rect x="684" y="160" width="212" height="48" rx="10" fill="#EEFBE9"/>
