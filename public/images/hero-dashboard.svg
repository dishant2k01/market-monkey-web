  <!-- Main -->
  <rect x="196" y="0" width="764" height="72" fill="#FFFFFF"/>
  <rect x="228" y="28" width="180" height="16" rx="8" fill="#E5E7EB"/>
  <rect x="720" y="22" width="96" height="28" rx="8" fill="#4ECB3D"/>
  <circle cx="860" cy="36" r="16" fill="#E5E7EB"/>

  <!-- Market Overview card -->
